name: 'Navigator'
type: theme
description: 'Olivero with tighter spacing and layouts for guides and the journeys page.'
package: Custom
core_version_requirement: ^11
base theme: olivero
libraries:
  - nsn_theme/global
# A sub-theme must list its regions, or it gets Drupal's defaults instead of
# Olivero's. These match olivero.info.yml.
regions:
  header: Header
  primary_menu: Primary menu
  secondary_menu: Secondary menu
  hero: Hero (full width)
  highlighted: Highlighted
  breadcrumb: Breadcrumb
  social: Social Bar
  content_above: Content Above
  content: Content
  sidebar: Sidebar
  content_below: Content Below
  footer_top: Footer Top
  footer_bottom: Footer Bottom
